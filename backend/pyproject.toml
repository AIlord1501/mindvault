[build-system]
requires = ["setuptools>=58.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mindvault-backend"
version = "0.1.0"
description = "Offline-first local knowledge backend for MindVault"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.109.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "rank-bm25>=0.2.2,<1.0.0",
]

[project.optional-dependencies]
ingestion = [
    "PyMuPDF>=1.23.0,<2.0.0",
    "Pillow>=10.0.0,<12.0.0",
]
ocr = [
    "Pillow>=10.0.0,<12.0.0",
    "pytesseract>=0.3.10,<1.0.0",
]
audio = [
    "faster-whisper>=1.0.0,<2.0.0",
]
vector = [
    "chromadb>=0.4.22,<1.0.0",
    "sentence-transformers>=2.5.0,<4.0.0",
    "rank-bm25>=0.2.2,<1.0.0",
]
llm = [
    "llama-cpp-python>=0.2.70",
]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
    "httpx>=0.25.0,<1.0.0",
    "ruff>=0.4.0,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
