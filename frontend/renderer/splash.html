<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'none'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none';"
    />
    <title>Starting MindVault...</title>
    <link rel="stylesheet" href="./css/splash.css" />
  </head>
  <body>
    <main class="splash">
      <div class="splash-logo" aria-hidden="true">MV</div>
      <h1>MindVault</h1>
      <p class="splash-subtitle">Offline-first personal knowledge workspace</p>
      <div class="splash-loader" role="status" aria-label="Loading">
        <span class="splash-bar"></span>
      </div>
      <p class="splash-note">Starting local backend on 127.0.0.1...</p>
    </main>
  </body>
</html>
